[project]
name = "hacking"
version = "0.1.0"
description = "A retro Textual interface for authorized, low-impact security checks"
readme = "README.md"
authors = [
	{ name = "Miguel Poveda", email = "mapenzo@users.noreply.github.com" },
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
	"paramiko>=3.5,<5",
	"pyfiglet>=1.0.2",
	"textual>=1.0.0",
]

[project.scripts]
retro-audit = "retro_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/mapenzo/retro-audit-commander"
Repository = "https://github.com/mapenzo/retro-audit-commander"
Issues = "https://github.com/mapenzo/retro-audit-commander/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retro_audit"]

[dependency-groups]
dev = [
	"cyclonedx-bom>=5",
	"pyinstaller>=6.11,<7",
	"pytest>=8.3,<9",
]
