name: Build and release executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            archive: zip
          - platform: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Build PyInstaller distribution
        run: >-
          uv run pyinstaller --noconfirm --clean
          --distpath build/dist/${{ matrix.platform }}
          --workpath build/work/${{ matrix.platform }}
          --specpath build/spec/${{ matrix.platform }}
          packaging/retro_audit.spec
      - name: Smoke test distribution
        run: uv run python scripts/smoke_test_artifact.py build/dist/${{ matrix.platform }}/retro-audit
      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path build/dist/${{ matrix.platform }}/retro-audit -DestinationPath release/retro-audit-${{ matrix.platform }}.zip
      - name: Create Unix archive
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p release
          tar -C build/dist/${{ matrix.platform }} -czf release/retro-audit-${{ matrix.platform }}.tar.gz retro-audit
      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment --of JSON --output-reproducible
          -o release/retro-audit-${{ matrix.platform }}.cdx.json
      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: retro-audit-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*